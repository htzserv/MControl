name: Build & Publish MControl Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read Version
        id: ver
        run: |
          V=$(tr -d '[:space:]' < VERSION)
          echo "version=${V}" >> "$GITHUB_OUTPUT"
          echo "tag=v${V}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build MControl Android APK
        run: |
          gradle assembleRelease --no-daemon --stacktrace
          mkdir -p dist
          V="${{ steps.ver.outputs.version }}"
          cp app/build/outputs/apk/release/app-release.apk "dist/MControl-Android-v${V}.apk"
          cd dist && sha256sum "MControl-Android-v${V}.apk" > "MControl-Android-v${V}.apk.sha256"
          ls -lh

      - name: Upload APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MControl-Android-v${{ steps.ver.outputs.version }}-APK
          path: dist/MControl-Android-v${{ steps.ver.outputs.version }}.apk

      - name: Attach APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          TAG="${{ steps.ver.outputs.tag }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "MControl ${TAG}" --notes "MControl ${TAG} release including native Android APK (MDesign Material 3)." --latest
          fi
          gh release upload "$TAG" "dist/MControl-Android-v${V}.apk" "dist/MControl-Android-v${V}.apk.sha256" --clobber
