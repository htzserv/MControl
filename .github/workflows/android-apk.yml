name: Build & Publish MControl Android APK

on:
  push:
    branches: ["main", "v2-core"]
    paths-ignore:
      - "README.md"
      - "CHANGELOG.md"
  workflow_dispatch:
    inputs:
      channel:
        description: "APK channel (auto = official if VERSION is new, else rolling beta-latest)"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - release
          - beta

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Release vs Rolling Beta
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_CHANNEL: ${{ github.event.inputs.channel || 'auto' }}
        run: |
          V=$(tr -d '[:space:]' < VERSION)
          TAG="v${V}"
          SHORT_SHA=$(git rev-parse --short HEAD)
          BUILD_NUM="${{ github.run_number }}"
          MODE="$DISPATCH_CHANNEL"
          if [ "$MODE" = "auto" ]; then
            if gh release view "$TAG" >/dev/null 2>&1; then
              MODE="beta"
            else
              MODE="release"
            fi
          fi
          echo "version=${V}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "mode=${MODE}" >> "$GITHUB_OUTPUT"
          echo "build_num=${BUILD_NUM}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "Building MControl Android APK v${V} (mode=${MODE}, build=#${BUILD_NUM}, commit=${SHORT_SHA})"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Prepare Release Signing Keystore
        id: sign
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          KS_FILE="${RUNNER_TEMP}/mcontrol-release.jks"
          if [ -n "${KS_B64:-}" ] && [ -n "${KS_PASS:-}" ]; then
            echo "$KS_B64" | base64 -d > "$KS_FILE"
            echo "ks_path=${KS_FILE}" >> "$GITHUB_OUTPUT"
            echo "ks_pass=${KS_PASS}" >> "$GITHUB_OUTPUT"
            echo "key_alias=${KEY_ALIAS:-mcontrol}" >> "$GITHUB_OUTPUT"
            echo "key_pass=${KEY_PASS:-$KS_PASS}" >> "$GITHUB_OUTPUT"
            echo "Using persistent Release Keystore from GitHub Secrets."
          else
            # Generate a clean RSA-2048 Release Keystore (avoids Android Debug cert CN=Android Debug)
            GEN_PASS="MControlRelease2026!"
            keytool -genkeypair -v               -keystore "$KS_FILE"               -storetype PKCS12               -keyalg RSA -keysize 2048 -validity 10000               -alias mcontrol               -storepass "$GEN_PASS" -keypass "$GEN_PASS"               -dname "CN=MControl, OU=MDesign, O=MDesign, L=Tehran, C=IR"
            echo "ks_path=${KS_FILE}" >> "$GITHUB_OUTPUT"
            echo "ks_pass=${GEN_PASS}" >> "$GITHUB_OUTPUT"
            echo "key_alias=mcontrol" >> "$GITHUB_OUTPUT"
            echo "key_pass=${GEN_PASS}" >> "$GITHUB_OUTPUT"
            echo "::notice::Using generated MDesign Release Keystore. For permanent Play Protect trust across updates, add ANDROID_KEYSTORE_BASE64 & ANDROID_KEYSTORE_PASSWORD to GitHub Secrets."
          fi

      - name: Build MControl Android APK
        env:
          MC_VER: ${{ steps.ver.outputs.version }}
          MC_BNUM: ${{ steps.ver.outputs.build_num }}
          MC_SHA: ${{ steps.ver.outputs.short_sha }}
          MC_MODE: ${{ steps.ver.outputs.mode }}
          MCONTROL_KEYSTORE_PATH: ${{ steps.sign.outputs.ks_path }}
          MCONTROL_KEYSTORE_PASSWORD: ${{ steps.sign.outputs.ks_pass }}
          MCONTROL_KEY_ALIAS: ${{ steps.sign.outputs.key_alias }}
          MCONTROL_KEY_PASSWORD: ${{ steps.sign.outputs.key_pass }}
        run: |
          gradle assembleRelease --no-daemon --stacktrace
          mkdir -p dist
          V="${MC_VER}"
          cp app/build/outputs/apk/release/app-release.apk "dist/MControl-Android-v${V}.apk"
          cp app/build/outputs/apk/release/app-release.apk "dist/MControl-Android-latest.apk"
          cp app/build/outputs/apk/release/app-release.apk "dist/MControl-Android-beta.apk"
          cd dist
          sha256sum "MControl-Android-v${V}.apk" > "MControl-Android-v${V}.apk.sha256"
          sha256sum "MControl-Android-latest.apk" > "MControl-Android-latest.apk.sha256"
          sha256sum "MControl-Android-beta.apk" > "MControl-Android-beta.apk.sha256"
          python3 - <<'PYEOF'
          import json, os, time
          meta = {
              "version": os.environ["MC_VER"],
              "build_number": int(os.environ["MC_BNUM"]),
              "tag": f"v{os.environ['MC_VER']}-beta.{os.environ['MC_BNUM']}",
              "commit": os.environ["MC_SHA"],
              "channel": os.environ["MC_MODE"],
              "apk_file": "MControl-Android-beta.apk",
              "built_at": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
          }
          with open("apk-beta-meta.json", "w") as f:
              json.dump(meta, f, indent=2)
          PYEOF
          ls -lh

      - name: Upload APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MControl-Android-v${{ steps.ver.outputs.version }}-${{ steps.ver.outputs.mode }}-APK
          path: dist/MControl-Android-v${{ steps.ver.outputs.version }}.apk

      - name: Publish APK to GitHub Releases (Stable & Beta)
        env:
          GH_TOKEN: ${{ github.token }}
          MC_VER: ${{ steps.ver.outputs.version }}
          MC_TAG: ${{ steps.ver.outputs.tag }}
          MC_MODE: ${{ steps.ver.outputs.mode }}
          MC_BNUM: ${{ steps.ver.outputs.build_num }}
        run: |
          set -euo pipefail
          # Always update rolling beta-latest release with latest Beta APK
          if ! gh release view "beta-latest" >/dev/null 2>&1; then
            gh release create "beta-latest" --title "MControl Rolling Beta (v${MC_VER} #${MC_BNUM})" --notes "Rolling beta builds including MControl Android Beta APK." --prerelease
          fi
          gh release upload "beta-latest"             "dist/MControl-Android-beta.apk"             "dist/MControl-Android-beta.apk.sha256"             "dist/MControl-Android-latest.apk"             "dist/MControl-Android-latest.apk.sha256"             "dist/apk-beta-meta.json"             --clobber

          # In official release mode, also attach to vX.Y.Z release
          if [ "$MC_MODE" = "release" ]; then
            if ! gh release view "$MC_TAG" >/dev/null 2>&1; then
              gh release create "$MC_TAG" --title "MControl ${MC_TAG}" --notes "MControl ${MC_TAG} release including native Android APK (MDesign Material 3)." --latest
            fi
            gh release upload "$MC_TAG"               "dist/MControl-Android-v${MC_VER}.apk"               "dist/MControl-Android-v${MC_VER}.apk.sha256"               "dist/MControl-Android-latest.apk"               "dist/MControl-Android-latest.apk.sha256"               --clobber
          fi

      - name: Sync Android APK (Stable & Beta) to ParsPack Iran Mirror (S3)
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.PP_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.PP_SECRET_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          PP_ENDPOINT: ${{ secrets.PP_ENDPOINT }}
          PP_BUCKET: ${{ secrets.PP_BUCKET }}
          MC_MODE: ${{ steps.ver.outputs.mode }}
        run: |
          if [ -z "${AWS_ACCESS_KEY_ID:-}" ] || [ -z "${PP_ENDPOINT:-}" ] || [ -z "${PP_BUCKET:-}" ]; then
            echo "ParsPack S3 secrets not configured — skipping APK mirror sync."
            exit 0
          fi
          EP="${PP_ENDPOINT%/}"
          aws configure set default.s3.max_concurrent_requests 1
          aws configure set default.s3.multipart_threshold 64MB
          upload_to() {
            pfx="$1"
            for f in dist/*; do
              [ -f "$f" ] || continue
              b=$(basename "$f")
              ok=0
              for i in 1 2 3; do
                if aws --endpoint-url "$EP" s3 cp "$f" "s3://${PP_BUCKET}/${pfx}/${b}" --acl public-read                    || aws --endpoint-url "$EP" s3 cp "$f" "s3://${PP_BUCKET}/${pfx}/${b}"; then
                  ok=1; break
                fi
                sleep $((i * 4))
              done
              [ "$ok" -eq 1 ] || echo "::warning::Could not upload ${b} to ParsPack ${pfx}"
            done
          }
          upload_to "MControl/beta-latest"
          if [ "$MC_MODE" = "release" ]; then
            upload_to "MControl"
          fi
          echo "ParsPack Android APK mirror sync complete (mode=${MC_MODE})!"
