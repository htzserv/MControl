name: Build & Publish MControl Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read Version
        id: ver
        run: |
          V=$(tr -d '[:space:]' < VERSION)
          echo "version=${V}" >> "$GITHUB_OUTPUT"
          echo "tag=v${V}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build MControl Android APK
        run: |
          gradle assembleRelease --no-daemon --stacktrace
          mkdir -p dist
          V="${{ steps.ver.outputs.version }}"
          cp app/build/outputs/apk/release/app-release.apk "dist/MControl-Android-v${V}.apk"
          cp app/build/outputs/apk/release/app-release.apk "dist/MControl-Android-latest.apk"
          cd dist
          sha256sum "MControl-Android-v${V}.apk" > "MControl-Android-v${V}.apk.sha256"
          sha256sum "MControl-Android-latest.apk" > "MControl-Android-latest.apk.sha256"
          ls -lh

      - name: Upload APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MControl-Android-v${{ steps.ver.outputs.version }}-APK
          path: dist/MControl-Android-v${{ steps.ver.outputs.version }}.apk

      - name: Attach APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          TAG="${{ steps.ver.outputs.tag }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "MControl ${TAG}" --notes "MControl ${TAG} release including native Android APK (MDesign Material 3)." --latest
          fi
          gh release upload "$TAG"             "dist/MControl-Android-v${V}.apk"             "dist/MControl-Android-v${V}.apk.sha256"             "dist/MControl-Android-latest.apk"             "dist/MControl-Android-latest.apk.sha256"             --clobber

      - name: Sync Android APK to ParsPack Iran Mirror (S3)
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.PP_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.PP_SECRET_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          PP_ENDPOINT: ${{ secrets.PP_ENDPOINT }}
          PP_BUCKET: ${{ secrets.PP_BUCKET }}
        run: |
          if [ -z "${AWS_ACCESS_KEY_ID:-}" ] || [ -z "${PP_ENDPOINT:-}" ] || [ -z "${PP_BUCKET:-}" ]; then
            echo "ParsPack S3 secrets not configured — skipping APK mirror sync."
            exit 0
          fi
          EP="${PP_ENDPOINT%/}"
          aws configure set default.s3.max_concurrent_requests 1
          aws configure set default.s3.multipart_threshold 64MB
          for pfx in "MControl" "MControl/beta-latest"; do
            for f in dist/*; do
              [ -f "$f" ] || continue
              b=$(basename "$f")
              ok=0
              for i in 1 2 3; do
                if aws --endpoint-url "$EP" s3 cp "$f" "s3://${PP_BUCKET}/${pfx}/${b}" --acl public-read                    || aws --endpoint-url "$EP" s3 cp "$f" "s3://${PP_BUCKET}/${pfx}/${b}"; then
                  ok=1; break
                fi
                sleep $((i * 4))
              done
              [ "$ok" -eq 1 ] || echo "::warning::Could not upload ${b} to ParsPack ${pfx}"
            done
          done
          echo "ParsPack Android APK mirror sync complete!"
