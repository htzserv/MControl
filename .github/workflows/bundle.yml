name: Build Static Prereqs & Engines Bundle

on:
  workflow_dispatch:
  push:
    branches: ["main", "v2-core"]
    paths:
      - ".github/workflows/bundle.yml"
      - "assets/engines/**"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare static tools, Xray Core & tunnel engines
        run: |
          set -euo pipefail
          mkdir -p bundle/bin tmp_dl dist

          curl -fsSL "https://github.com/jqlang/jq/releases/download/jq-1.7.1/jq-linux-amd64" -o bundle/bin/jq
          chmod 755 bundle/bin/jq

          curl -fsSL "https://install.speedtest.net/app/cli/ookla-speedtest-1.2.0-linux-x86_64.tgz" -o tmp_dl/speedtest.tgz
          tar -xzf tmp_dl/speedtest.tgz -C tmp_dl speedtest
          install -m 755 tmp_dl/speedtest bundle/bin/speedtest

          curl -fsSL "https://github.com/andrew-d/static-binaries/raw/master/binaries/linux/x86_64/socat" -o bundle/bin/socat || true
          [ -s bundle/bin/socat ] && chmod 755 bundle/bin/socat || rm -f bundle/bin/socat

          # Xray Core (amd64 bundled + standalone amd64 & arm64 for Iran Mirror)
          curl -fsSL "https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip" -o tmp_dl/xray-amd64.zip
          unzip -qo tmp_dl/xray-amd64.zip xray -d tmp_dl/xray64
          install -m 755 tmp_dl/xray64/xray bundle/bin/xray
          install -m 755 tmp_dl/xray64/xray dist/xray-linux-amd64

          curl -fsSL "https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-arm64-v8a.zip" -o tmp_dl/xray-arm64.zip
          unzip -qo tmp_dl/xray-arm64.zip xray -d tmp_dl/xrayarm64
          install -m 755 tmp_dl/xrayarm64/xray dist/xray-linux-arm64

          BH_REPO="${{ vars.BACKHAUL_REPO || 'htzserv/Backhaul' }}"
          if [ -f assets/engines/bh ]; then
            install -m 755 assets/engines/bh bundle/bin/bh
          elif curl -fsSL "https://github.com/${BH_REPO}/releases/latest/download/bh-linux-amd64" -o tmp_dl/bh-custom && [ -s tmp_dl/bh-custom ]; then
            echo "Bundled custom Backhaul from ${BH_REPO}"
            install -m 755 tmp_dl/bh-custom bundle/bin/bh
          else
            echo "Custom Backhaul release not found on ${BH_REPO}, falling back to upstream Musixal/Backhaul..."
            curl -fsSL "https://github.com/Musixal/Backhaul/releases/latest/download/backhaul_linux_amd64.tar.gz" -o tmp_dl/bh.tar.gz
            tar -xzf tmp_dl/bh.tar.gz -C tmp_dl
            BH_BIN=$(find tmp_dl -maxdepth 2 -type f -name 'backhaul' | head -n1)
            install -m 755 "$BH_BIN" bundle/bin/bh
          fi
          ln -sf bh bundle/bin/backhaul

          if [ -f assets/engines/rathole ]; then
            install -m 755 assets/engines/rathole bundle/bin/rathole
          else
            curl -fsSL "https://github.com/rapiz1/rathole/releases/latest/download/rathole-x86_64-unknown-linux-gnu.zip" -o tmp_dl/rathole.zip
            unzip -qo tmp_dl/rathole.zip -d tmp_dl/rh
            install -m 755 tmp_dl/rh/rathole bundle/bin/rathole
          fi

          if [ -f assets/engines/paqet ]; then
            install -m 755 assets/engines/paqet bundle/bin/paqet
          else
            PQ_URL=$(curl -fsSL "https://api.github.com/repos/hanselime/paqet/releases/latest" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next((a["browser_download_url"] for a in d.get("assets",[]) if "linux" in a.get("name","").lower() and ("amd64" in a.get("name","").lower() or "x86_64" in a.get("name","").lower()) and not a.get("name","").lower().endswith((".sha256",".txt"))), ""))' || true)
            if [ -n "$PQ_URL" ]; then
              echo "Downloading Paqet from $PQ_URL ..."
              mkdir -p tmp_dl/pq
              curl -fsSL "$PQ_URL" -o tmp_dl/pq/pkg
              case "$PQ_URL" in
                *.tar.gz|*.tgz) tar -xzf tmp_dl/pq/pkg -C tmp_dl/pq ;;
                *.zip)          unzip -qo tmp_dl/pq/pkg -d tmp_dl/pq ;;
                *)              mv tmp_dl/pq/pkg tmp_dl/pq/paqet ;;
              esac
              PQ_BIN=$(find tmp_dl/pq -maxdepth 3 -type f -name 'paqet*' ! -name '*.tar.gz' ! -name '*.zip' | head -n1)
              if [ -n "$PQ_BIN" ]; then
                install -m 755 "$PQ_BIN" bundle/bin/paqet
              fi
            fi
          fi

          if [ -f assets/engines/realm ]; then
            install -m 755 assets/engines/realm bundle/bin/realm
          else
            curl -fsSL "https://github.com/zhboner/realm/releases/latest/download/realm-x86_64-unknown-linux-musl.tar.gz" -o tmp_dl/realm.tar.gz
            tar -xzf tmp_dl/realm.tar.gz -C tmp_dl
            install -m 755 tmp_dl/realm bundle/bin/realm
          fi

          tar -czf dist/mcontrol-bundle-linux-amd64.tar.gz -C bundle bin
          (cd dist && for f in mcontrol-bundle-linux-amd64.tar.gz xray-linux-amd64 xray-linux-arm64; do
            sha256sum "$f" > "${f}.sha256"
          done)
          ls -lh dist/

      - name: Publish Bundle & Xray Core to GitHub Release (bundle-latest via gh CLI)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TITLE="MControl Static Bundle (Prereqs + Xray + Engines)"
          if gh release view "bundle-latest" >/dev/null 2>&1; then
            gh release edit "bundle-latest" --title "$TITLE" --latest=false
          else
            gh release create "bundle-latest" --title "$TITLE" --notes "Static prereqs, Xray Core & tunnel engines." --latest=false
          fi
          for f in dist/mcontrol-bundle-linux-amd64.tar.gz dist/mcontrol-bundle-linux-amd64.tar.gz.sha256 dist/xray-linux-amd64 dist/xray-linux-amd64.sha256 dist/xray-linux-arm64 dist/xray-linux-arm64.sha256; do
            ok=0
            for attempt in 1 2 3; do
              if gh release upload "bundle-latest" "$f" --clobber; then ok=1; break; fi
              sleep $((attempt * 3))
            done
            [ "$ok" -eq 1 ] || exit 1
          done

      - name: Upload Static Bundle & Xray Core to ParsPack S3 Mirror
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.PP_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.PP_SECRET_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          PP_ENDPOINT: ${{ secrets.PP_ENDPOINT }}
          PP_BUCKET: ${{ secrets.PP_BUCKET }}
        run: |
          if [ -z "${AWS_ACCESS_KEY_ID:-}" ] || [ -z "${PP_ENDPOINT:-}" ] || [ -z "${PP_BUCKET:-}" ]; then
            echo "ParsPack S3 secrets not configured — skipping bundle mirror upload."
            exit 0
          fi
          EP="${PP_ENDPOINT%/}"
          cp_retry() {
            for i in 1 2 3; do
              if aws --endpoint-url "$EP" s3 cp "$1" "$2" --acl public-read; then return 0; fi
              echo "Upload attempt $i failed for $1, retrying..."
              sleep $((i * 4))
            done
            return 1
          }
          echo "Uploading static bundle & Xray Core (amd64-only) to ${EP}/${PP_BUCKET}/MControl/ ..."
          for f in mcontrol-bundle-linux-amd64.tar.gz mcontrol-bundle-linux-amd64.tar.gz.sha256 xray-linux-amd64 xray-linux-amd64.sha256; do
            cp_retry "dist/${f}" "s3://${PP_BUCKET}/MControl/${f}"
          done
          aws --endpoint-url "$EP" s3 rm "s3://${PP_BUCKET}/MControl/xray-linux-arm64" >/dev/null 2>&1 || true
          aws --endpoint-url "$EP" s3 rm "s3://${PP_BUCKET}/MControl/xray-linux-arm64.sha256" >/dev/null 2>&1 || true
          echo "ParsPack S3 Bundle & Xray upload complete (amd64-only)!"
