name: Auto-Sync Prereqs, Xray & Engines Bundle

on:
  schedule:
    - cron: "0 */6 * * *"
  repository_dispatch:
    types: [sync-prereqs, backhaul-released]
  workflow_dispatch:
    inputs:
      force:
        description: "Force rebuild & mirror sync even if upstream versions are unchanged"
        required: false
        default: true
        type: boolean
  push:
    branches: ["main", "v2-core"]
    paths:
      - ".github/workflows/bundle.yml"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.chk.outputs.changed }}
      bh_ver: ${{ steps.chk.outputs.bh_ver }}
      xray_ver: ${{ steps.chk.outputs.xray_ver }}
      rathole_ver: ${{ steps.chk.outputs.rathole_ver }}
      paqet_ver: ${{ steps.chk.outputs.paqet_ver }}
      realm_ver: ${{ steps.chk.outputs.realm_ver }}
      jq_ver: ${{ steps.chk.outputs.jq_ver }}
    steps:
      - name: Check upstream repository releases vs current bundle manifest
        id: chk
        env:
          GH_TOKEN: ${{ github.token }}
          BH_REPO: ${{ vars.BACKHAUL_REPO || 'htzserv/Backhaul' }}
          FORCE_SYNC: ${{ github.event_name != 'schedule' || github.event.inputs.force == 'true' }}
        run: |
          python3 - <<'PYEOF'
          import json, os, urllib.request

          gh_token = os.environ.get("GH_TOKEN", "")
          bh_repo = os.environ.get("BH_REPO", "htzserv/Backhaul")
          force = os.environ.get("FORCE_SYNC", "true").lower() == "true"

          def fetch_json(url):
              req = urllib.request.Request(url, headers={"User-Agent": "MControl-AutoSync/1.0"})
              if gh_token and "api.github.com" in url:
                  req.add_header("Authorization", f"Bearer {gh_token}")
              try:
                  with urllib.request.urlopen(req, timeout=20) as r:
                      return json.loads(r.read().decode("utf-8"))
              except Exception:
                  return {}

          def latest_tag(repo, fallback=""):
              d = fetch_json(f"https://api.github.com/repos/{repo}/releases/latest")
              return (d.get("tag_name") or fallback).strip()

          cur = {
              "backhaul": latest_tag(bh_repo, "latest"),
              "xray": latest_tag("XTLS/Xray-core", "latest"),
              "rathole": latest_tag("rapiz1/rathole", "latest"),
              "paqet": latest_tag("hanselime/paqet", "latest"),
              "realm": latest_tag("zhboner/realm", "latest"),
              "jq": latest_tag("jqlang/jq", "jq-1.7.1"),
          }
          if not cur["backhaul"] or cur["backhaul"] == "latest":
              cur["backhaul"] = latest_tag("Musixal/Backhaul", "latest")

          prev = fetch_json("https://github.com/htzserv/MControl/releases/download/bundle-latest/bundle-manifest.json")
          prev_vers = prev.get("versions", {}) if isinstance(prev, dict) else {}

          changed = force or any(prev_vers.get(k) != v for k, v in cur.items())
          print("Previous manifest versions:", prev_vers)
          print("Upstream latest versions:  ", cur)
          print("Rebuild needed:", changed)

          out = os.environ["GITHUB_OUTPUT"]
          with open(out, "a", encoding="utf-8") as f:
              f.write(f"changed={'true' if changed else 'false'}\n")
              f.write(f"bh_ver={cur['backhaul']}\n")
              f.write(f"xray_ver={cur['xray']}\n")
              f.write(f"rathole_ver={cur['rathole']}\n")
              f.write(f"paqet_ver={cur['paqet']}\n")
              f.write(f"realm_ver={cur['realm']}\n")
              f.write(f"jq_ver={cur['jq']}\n")
          PYEOF

  build-bundle:
    needs: check-upstream
    if: needs.check-upstream.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync latest binaries from upstream repos & build bundle
        env:
          GH_TOKEN: ${{ github.token }}
          BH_REPO: ${{ vars.BACKHAUL_REPO || 'htzserv/Backhaul' }}
          BH_VER: ${{ needs.check-upstream.outputs.bh_ver }}
          XRAY_VER: ${{ needs.check-upstream.outputs.xray_ver }}
          RATHOLE_VER: ${{ needs.check-upstream.outputs.rathole_ver }}
          PAQET_VER: ${{ needs.check-upstream.outputs.paqet_ver }}
          REALM_VER: ${{ needs.check-upstream.outputs.realm_ver }}
          JQ_VER: ${{ needs.check-upstream.outputs.jq_ver }}
        run: |
          set -euo pipefail
          mkdir -p bundle/bin tmp_dl dist

          # 1. jq (latest from jqlang/jq)
          curl -fsSL "https://github.com/jqlang/jq/releases/latest/download/jq-linux-amd64" -o bundle/bin/jq \
            || curl -fsSL "https://github.com/jqlang/jq/releases/download/jq-1.7.1/jq-linux-amd64" -o bundle/bin/jq
          chmod 755 bundle/bin/jq

          # 2. Ookla Speedtest & socat
          curl -fsSL "https://install.speedtest.net/app/cli/ookla-speedtest-1.2.0-linux-x86_64.tgz" -o tmp_dl/speedtest.tgz
          tar -xzf tmp_dl/speedtest.tgz -C tmp_dl speedtest
          install -m 755 tmp_dl/speedtest bundle/bin/speedtest

          curl -fsSL "https://github.com/andrew-d/static-binaries/raw/master/binaries/linux/x86_64/socat" -o bundle/bin/socat || true
          [ -s bundle/bin/socat ] && chmod 755 bundle/bin/socat || rm -f bundle/bin/socat

          # 3. Xray Core (auto-synced from XTLS/Xray-core latest release)
          curl -fsSL "https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip" -o tmp_dl/xray-amd64.zip
          unzip -qo tmp_dl/xray-amd64.zip xray -d tmp_dl/xray64
          install -m 755 tmp_dl/xray64/xray bundle/bin/xray
          install -m 755 tmp_dl/xray64/xray dist/xray-linux-amd64

          curl -fsSL "https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-arm64-v8a.zip" -o tmp_dl/xray-arm64.zip
          unzip -qo tmp_dl/xray-arm64.zip xray -d tmp_dl/xrayarm64
          install -m 755 tmp_dl/xrayarm64/xray dist/xray-linux-arm64

          # 4. Backhaul (ALWAYS synced directly from BACKHAUL_REPO latest release, never static repo assets)
          if curl -fsSL "https://github.com/${BH_REPO}/releases/latest/download/bh-linux-amd64" -o tmp_dl/bh-custom && [ -s tmp_dl/bh-custom ]; then
            echo "Synced Backhaul (${BH_VER}) from ${BH_REPO}"
            install -m 755 tmp_dl/bh-custom bundle/bin/bh
          else
            echo "Fallback: downloading upstream Musixal/Backhaul..."
            curl -fsSL "https://github.com/Musixal/Backhaul/releases/latest/download/backhaul_linux_amd64.tar.gz" -o tmp_dl/bh.tar.gz
            tar -xzf tmp_dl/bh.tar.gz -C tmp_dl
            BH_BIN=$(find tmp_dl -maxdepth 2 -type f -name 'backhaul' | head -n1)
            install -m 755 "$BH_BIN" bundle/bin/bh
          fi
          ln -sf bh bundle/bin/backhaul

          # 5. Rathole (auto-synced from rapiz1/rathole)
          curl -fsSL "https://github.com/rapiz1/rathole/releases/latest/download/rathole-x86_64-unknown-linux-gnu.zip" -o tmp_dl/rathole.zip
          unzip -qo tmp_dl/rathole.zip -d tmp_dl/rh
          install -m 755 tmp_dl/rh/rathole bundle/bin/rathole

          # 6. Paqet (auto-synced from hanselime/paqet)
          PQ_URL=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" "https://api.github.com/repos/hanselime/paqet/releases/latest" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next((a["browser_download_url"] for a in d.get("assets",[]) if "linux" in a.get("name","").lower() and ("amd64" in a.get("name","").lower() or "x86_64" in a.get("name","").lower()) and not a.get("name","").lower().endswith((".sha256",".txt"))), ""))' || true)
          if [ -n "$PQ_URL" ]; then
            echo "Synced Paqet (${PAQET_VER}) from $PQ_URL"
            mkdir -p tmp_dl/pq
            curl -fsSL "$PQ_URL" -o tmp_dl/pq/pkg
            case "$PQ_URL" in
              *.tar.gz|*.tgz) tar -xzf tmp_dl/pq/pkg -C tmp_dl/pq ;;
              *.zip)          unzip -qo tmp_dl/pq/pkg -d tmp_dl/pq ;;
              *)              mv tmp_dl/pq/pkg tmp_dl/pq/paqet ;;
            esac
            PQ_BIN=$(find tmp_dl/pq -maxdepth 3 -type f -name 'paqet*' ! -name '*.tar.gz' ! -name '*.zip' | head -n1)
            if [ -n "$PQ_BIN" ]; then
              install -m 755 "$PQ_BIN" bundle/bin/paqet
            fi
          fi

          # 7. Realm (auto-synced from zhboner/realm)
          curl -fsSL "https://github.com/zhboner/realm/releases/latest/download/realm-x86_64-unknown-linux-musl.tar.gz" -o tmp_dl/realm.tar.gz
          tar -xzf tmp_dl/realm.tar.gz -C tmp_dl
          install -m 755 tmp_dl/realm bundle/bin/realm

          # 8. Package bundle + generate bundle-manifest.json
          tar -czf dist/mcontrol-bundle-linux-amd64.tar.gz -C bundle bin
          (cd dist && for f in mcontrol-bundle-linux-amd64.tar.gz xray-linux-amd64 xray-linux-arm64; do
            sha256sum "$f" > "${f}.sha256"
          done)

          python3 - <<'PYEOF'
          import datetime, hashlib, json, os
          def sha(p):
              h = hashlib.sha256()
              with open(p, "rb") as f:
                  for c in iter(lambda: f.read(65536), b""):
                      h.update(c)
              return h.hexdigest()

          manifest = {
              "updated_at": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "backhaul_repo": os.environ.get("BH_REPO", "htzserv/Backhaul"),
              "versions": {
                  "backhaul": os.environ.get("BH_VER", ""),
                  "xray": os.environ.get("XRAY_VER", ""),
                  "rathole": os.environ.get("RATHOLE_VER", ""),
                  "paqet": os.environ.get("PAQET_VER", ""),
                  "realm": os.environ.get("REALM_VER", ""),
                  "jq": os.environ.get("JQ_VER", ""),
              },
              "bundle_sha256": sha("dist/mcontrol-bundle-linux-amd64.tar.gz"),
              "xray_amd64_sha256": sha("dist/xray-linux-amd64"),
          }
          with open("dist/bundle-manifest.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2)
          print(json.dumps(manifest, indent=2))
          PYEOF
          ls -lh dist/

      - name: Publish Bundle, Xray & Manifest to GitHub Release (bundle-latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TITLE="MControl Auto-Synced Prereqs & Engines Bundle"
          NOTES="Auto-synced from upstream repos (Backhaul ${{ needs.check-upstream.outputs.bh_ver }}, Xray ${{ needs.check-upstream.outputs.xray_ver }}, Rathole ${{ needs.check-upstream.outputs.rathole_ver }}, Paqet ${{ needs.check-upstream.outputs.paqet_ver }}, Realm ${{ needs.check-upstream.outputs.realm_ver }})."
          if gh release view "bundle-latest" >/dev/null 2>&1; then
            gh release edit "bundle-latest" --title "$TITLE" --notes "$NOTES" --latest=false
          else
            gh release create "bundle-latest" --title "$TITLE" --notes "$NOTES" --latest=false
          fi
          for f in dist/mcontrol-bundle-linux-amd64.tar.gz dist/mcontrol-bundle-linux-amd64.tar.gz.sha256 dist/xray-linux-amd64 dist/xray-linux-amd64.sha256 dist/xray-linux-arm64 dist/xray-linux-arm64.sha256 dist/bundle-manifest.json; do
            ok=0
            for attempt in 1 2 3; do
              if gh release upload "bundle-latest" "$f" --clobber; then ok=1; break; fi
              sleep $((attempt * 3))
            done
            [ "$ok" -eq 1 ] || exit 1
          done

      - name: Auto-Sync Bundle, Xray & Manifest to ParsPack S3 Mirror
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.PP_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.PP_SECRET_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          PP_ENDPOINT: ${{ secrets.PP_ENDPOINT }}
          PP_BUCKET: ${{ secrets.PP_BUCKET }}
        run: |
          if [ -z "${AWS_ACCESS_KEY_ID:-}" ] || [ -z "${PP_ENDPOINT:-}" ] || [ -z "${PP_BUCKET:-}" ]; then
            echo "ParsPack S3 secrets not configured — skipping bundle mirror upload."
            exit 0
          fi
          EP="${PP_ENDPOINT%/}"
          cp_retry() {
            for i in 1 2 3; do
              if aws --endpoint-url "$EP" s3 cp "$1" "$2" --acl public-read; then return 0; fi
              echo "Upload attempt $i failed for $1, retrying..."
              sleep $((i * 4))
            done
            return 1
          }
          echo "Auto-syncing prereqs bundle, Xray Core & manifest to ${EP}/${PP_BUCKET}/MControl/ ..."
          for f in mcontrol-bundle-linux-amd64.tar.gz mcontrol-bundle-linux-amd64.tar.gz.sha256 xray-linux-amd64 xray-linux-amd64.sha256 bundle-manifest.json; do
            cp_retry "dist/${f}" "s3://${PP_BUCKET}/MControl/${f}"
          done
          echo "ParsPack S3 Mirror auto-sync complete!"
