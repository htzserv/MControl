name: Build & Publish MControl Release

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "README.md"
      - "CHANGELOG.md"
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel (auto = official if VERSION is new, else rolling beta-latest)"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - release
          - beta

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Determine Release vs Rolling Beta
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_CHANNEL: ${{ github.event.inputs.channel || 'auto' }}
        run: |
          V=$(tr -d '[:space:]' < VERSION)
          TAG="v${V}"
          SHORT_SHA=$(git rev-parse --short HEAD)
          BUILD_NUM="${{ github.run_number }}"
          MODE="$DISPATCH_CHANNEL"
          if [ "$MODE" = "auto" ]; then
            if gh release view "$TAG" >/dev/null 2>&1; then
              MODE="beta"
            else
              MODE="release"
            fi
          fi
          echo "version=${V}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "mode=${MODE}" >> "$GITHUB_OUTPUT"
          echo "build_num=${BUILD_NUM}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "Building MControl v${V} (mode=${MODE}, build=#${BUILD_NUM}, commit=${SHORT_SHA})"

      - name: Tidy & Verify Go code
        run: |
          go mod tidy
          go vet ./...

      - name: Build static Linux binaries (amd64 & arm64)
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/mcontrol-linux-amd64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o dist/mcontrol-linux-arm64 .
          cp VERSION dist/VERSION
          cp mcontrol-cli.sh dist/mcontrol-cli.sh
          printf '{"version":"%s","build":%s,"commit":"%s","tag":"%s-beta.%s","built_at":%s}\n' \
            "${{ steps.ver.outputs.version }}" \
            "${{ steps.ver.outputs.build_num }}" \
            "${{ steps.ver.outputs.short_sha }}" \
            "${{ steps.ver.outputs.version }}" \
            "${{ steps.ver.outputs.build_num }}" \
            "$(date +%s)" > dist/beta-meta.json

      - name: Package release ZIPs & SHA-256 checksums
        run: |
          cd dist
          mkdir -p pkg_amd64 pkg_arm64
          cp mcontrol-linux-amd64 pkg_amd64/mcontrol-linux-amd64
          cp mcontrol-cli.sh pkg_amd64/mcontrol-cli.sh
          cp VERSION pkg_amd64/VERSION
          (cd pkg_amd64 && zip -9 -q ../MControl-latest.zip mcontrol-linux-amd64 mcontrol-cli.sh VERSION)
          cp MControl-latest.zip MControl-linux-amd64.zip

          cp mcontrol-linux-arm64 pkg_arm64/mcontrol-linux-arm64
          cp mcontrol-cli.sh pkg_arm64/mcontrol-cli.sh
          cp VERSION pkg_arm64/VERSION
          (cd pkg_arm64 && zip -9 -q ../MControl-linux-arm64.zip mcontrol-linux-arm64 mcontrol-cli.sh VERSION)

          rm -rf pkg_amd64 pkg_arm64

          for f in MControl-latest.zip MControl-linux-amd64.zip MControl-linux-arm64.zip mcontrol-linux-amd64 mcontrol-linux-arm64; do
            sha256sum "$f" > "${f}.sha256"
          done
          ls -lh

      - name: Publish Official GitHub Release
        if: steps.ver.outputs.mode == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: MControl ${{ steps.ver.outputs.tag }}
          make_latest: true
          generate_release_notes: true
          files: |
            dist/VERSION
            dist/mcontrol-cli.sh
            dist/MControl-latest.zip
            dist/MControl-latest.zip.sha256
            dist/MControl-linux-amd64.zip
            dist/MControl-linux-amd64.zip.sha256
            dist/MControl-linux-arm64.zip
            dist/MControl-linux-arm64.zip.sha256
            dist/mcontrol-linux-amd64
            dist/mcontrol-linux-amd64.sha256
            dist/mcontrol-linux-arm64
            dist/mcontrol-linux-arm64.sha256

      - name: Update Rolling Beta Pre-Release (beta-latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beta-latest
          name: MControl Rolling Beta (${{ steps.ver.outputs.version }}-beta.${{ steps.ver.outputs.build_num }})
          prerelease: true
          make_latest: false
          body: |
            Rolling Beta Build **#${{ steps.ver.outputs.build_num }}** (`${{ steps.ver.outputs.short_sha }}`) based on `v${{ steps.ver.outputs.version }}`.
          files: |
            dist/VERSION
            dist/beta-meta.json
            dist/mcontrol-cli.sh
            dist/MControl-latest.zip
            dist/MControl-latest.zip.sha256
            dist/MControl-linux-amd64.zip
            dist/MControl-linux-amd64.zip.sha256
            dist/MControl-linux-arm64.zip
            dist/MControl-linux-arm64.zip.sha256
            dist/mcontrol-linux-amd64
            dist/mcontrol-linux-amd64.sha256
            dist/mcontrol-linux-arm64
            dist/mcontrol-linux-arm64.sha256
