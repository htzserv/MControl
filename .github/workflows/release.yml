name: Build & Publish MControl Release

on:
  push:
    branches: ["main", "v2-core"]
    paths-ignore:
      - "README.md"
      - "README.fa.md"
      - "CHANGELOG.md"
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel (auto = official if VERSION is new, else rolling beta-latest)"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - release
          - beta

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true
          cache-dependency-path: go.mod

      - name: Determine Release vs Rolling Beta
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_CHANNEL: ${{ github.event.inputs.channel || 'auto' }}
        run: |
          V=$(tr -d '[:space:]' < VERSION)
          TAG="v${V}"
          SHORT_SHA=$(git rev-parse --short HEAD)
          BUILD_NUM="${{ github.run_number }}"
          MODE="$DISPATCH_CHANNEL"
          if [ "$MODE" = "auto" ]; then
            if gh release view "$TAG" >/dev/null 2>&1; then
              MODE="beta"
            else
              MODE="release"
            fi
          fi
          echo "version=${V}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "mode=${MODE}" >> "$GITHUB_OUTPUT"
          echo "build_num=${BUILD_NUM}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "Building MControl v${V} (mode=${MODE}, build=#${BUILD_NUM}, commit=${SHORT_SHA})"

      - name: Tidy & Verify Go code
        run: |
          go mod tidy
          go vet ./...
          go test ./...

      - name: Build static Linux binaries (amd64 & arm64 in parallel)
        env:
          MC_VER: ${{ steps.ver.outputs.version }}
          MC_BNUM: ${{ steps.ver.outputs.build_num }}
          MC_SHA: ${{ steps.ver.outputs.short_sha }}
          MC_MODE: ${{ steps.ver.outputs.mode }}
        run: |
          set -euo pipefail
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/mcontrol-linux-amd64 . &
          p1=$!
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o dist/mcontrol-linux-arm64 . &
          p2=$!
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/mcontrol-agent-linux-amd64 ./cmd/mcontrol-agent &
          p3=$!
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o dist/mcontrol-agent-linux-arm64 ./cmd/mcontrol-agent &
          p4=$!
          wait "$p1" "$p2" "$p3" "$p4"

          cp VERSION dist/VERSION
          cp mcontrol-cli.sh dist/mcontrol-cli.sh
          cp main.sh dist/main.sh
          cp install.sh dist/install.sh
          cp CHANGELOG.md dist/CHANGELOG.md
          python3 - <<'PYEOF'
          import json, os, subprocess, time
          ver = os.environ["MC_VER"]
          bnum = int(os.environ["MC_BNUM"])
          sha = os.environ["MC_SHA"]
          msg = subprocess.check_output(["git", "log", "-1", "--pretty=format:%s%n%b"], text=True).strip()
          mode = os.environ.get("MC_MODE", "beta")
          meta = {
              "version": ver,
              "build": bnum,
              "commit": sha,
              "channel": mode,
              "tag": f"{ver}-beta.{bnum}",
              "built_at": int(time.time()),
              "changelog": msg,
          }
          with open("dist/beta-meta.json", "w", encoding="utf-8") as f:
              json.dump(meta, f, ensure_ascii=False)
          PYEOF

      - name: Package release ZIPs & SHA-256 checksums
        run: |
          set -euo pipefail
          cd dist
          mkdir -p pkg_amd64 pkg_arm64
          cp mcontrol-linux-amd64 mcontrol-cli.sh VERSION pkg_amd64/
          cp mcontrol-linux-arm64 mcontrol-cli.sh VERSION pkg_arm64/
          (cd pkg_amd64 && zip -6 -q ../MControl-latest.zip mcontrol-linux-amd64 mcontrol-cli.sh VERSION) &
          z1=$!
          (cd pkg_arm64 && zip -6 -q ../MControl-linux-arm64.zip mcontrol-linux-arm64 mcontrol-cli.sh VERSION) &
          z2=$!
          wait "$z1" "$z2"
          cp MControl-latest.zip MControl-linux-amd64.zip
          rm -rf pkg_amd64 pkg_arm64

          for f in MControl-latest.zip MControl-linux-amd64.zip MControl-linux-arm64.zip mcontrol-linux-amd64 mcontrol-linux-arm64 mcontrol-agent-linux-amd64 mcontrol-agent-linux-arm64; do
            sha256sum "$f" > "${f}.sha256"
          done
          ls -lh

      - name: Publish Official GitHub Release (batched gh CLI)
        if: steps.ver.outputs.mode == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          REL_TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$REL_TAG" >/dev/null 2>&1; then
            gh release edit "$REL_TAG" --title "MControl ${REL_TAG}" --latest
          else
            gh release create "$REL_TAG" --title "MControl ${REL_TAG}" --generate-notes --latest
          fi
          ASSETS=(
            dist/VERSION
            dist/CHANGELOG.md
            dist/mcontrol-cli.sh
            dist/main.sh
            dist/install.sh
            dist/MControl-latest.zip
            dist/MControl-latest.zip.sha256
            dist/MControl-linux-amd64.zip
            dist/MControl-linux-amd64.zip.sha256
            dist/MControl-linux-arm64.zip
            dist/MControl-linux-arm64.zip.sha256
            dist/mcontrol-linux-amd64
            dist/mcontrol-linux-amd64.sha256
            dist/mcontrol-linux-arm64
            dist/mcontrol-linux-arm64.sha256
            dist/mcontrol-agent-linux-amd64
            dist/mcontrol-agent-linux-amd64.sha256
            dist/mcontrol-agent-linux-arm64
            dist/mcontrol-agent-linux-arm64.sha256
          )
          ok=0
          for attempt in 1 2; do
            if gh release upload "$REL_TAG" "${ASSETS[@]}" --clobber; then ok=1; break; fi
            echo "Batch upload attempt $attempt failed, retrying in $((attempt * 3))s..."
            sleep $((attempt * 3))
          done
          if [ "$ok" -ne 1 ]; then
            echo "Falling back to per-file upload for $REL_TAG..."
            for f in "${ASSETS[@]}"; do
              f_ok=0
              for attempt in 1 2 3; do
                if gh release upload "$REL_TAG" "$f" --clobber; then f_ok=1; break; fi
                sleep $((attempt * 3))
              done
              [ "$f_ok" -eq 1 ] || { echo "Failed to upload $f to $REL_TAG"; exit 1; }
            done
          fi

      - name: Update Rolling Beta Pre-Release (batched beta-latest)
        env:
          GH_TOKEN: ${{ github.token }}
          MC_VER: ${{ steps.ver.outputs.version }}
          MC_BNUM: ${{ steps.ver.outputs.build_num }}
          MC_SHA: ${{ steps.ver.outputs.short_sha }}
        run: |
          set -euo pipefail
          TITLE="MControl Rolling Beta (${MC_VER}-beta.${MC_BNUM})"
          NOTES="Rolling Beta Build **#${MC_BNUM}** (\`${MC_SHA}\`) based on \`v${MC_VER}\`."
          if gh release view "beta-latest" >/dev/null 2>&1; then
            gh release edit "beta-latest" --title "$TITLE" --notes "$NOTES" --prerelease --latest=false
          else
            gh release create "beta-latest" --title "$TITLE" --notes "$NOTES" --prerelease --latest=false
          fi
          ASSETS=(
            dist/VERSION
            dist/beta-meta.json
            dist/mcontrol-cli.sh
            dist/main.sh
            dist/install.sh
            dist/MControl-latest.zip
            dist/MControl-latest.zip.sha256
            dist/MControl-linux-amd64.zip
            dist/MControl-linux-amd64.zip.sha256
            dist/MControl-linux-arm64.zip
            dist/MControl-linux-arm64.zip.sha256
            dist/mcontrol-linux-amd64
            dist/mcontrol-linux-amd64.sha256
            dist/mcontrol-linux-arm64
            dist/mcontrol-linux-arm64.sha256
            dist/mcontrol-agent-linux-amd64
            dist/mcontrol-agent-linux-amd64.sha256
            dist/mcontrol-agent-linux-arm64
            dist/mcontrol-agent-linux-arm64.sha256
          )
          ok=0
          for attempt in 1 2; do
            if gh release upload "beta-latest" "${ASSETS[@]}" --clobber; then ok=1; break; fi
            echo "Batch upload attempt $attempt failed, retrying in $((attempt * 3))s..."
            sleep $((attempt * 3))
          done
          if [ "$ok" -ne 1 ]; then
            echo "Falling back to per-file upload for beta-latest..."
            for f in "${ASSETS[@]}"; do
              f_ok=0
              for attempt in 1 2 3; do
                if gh release upload "beta-latest" "$f" --clobber; then f_ok=1; break; fi
                sleep $((attempt * 3))
              done
              [ "$f_ok" -eq 1 ] || { echo "Failed to upload $f to beta-latest"; exit 1; }
            done
          fi

      - name: Sync Release & Rolling Beta to ParsPack S3 Mirror (strict alert on failure)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.PP_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.PP_SECRET_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          PP_ENDPOINT: ${{ secrets.PP_ENDPOINT }}
          PP_BUCKET: ${{ secrets.PP_BUCKET }}
          MC_MODE: ${{ steps.ver.outputs.mode }}
        run: |
          set -euo pipefail
          if [ -z "${AWS_ACCESS_KEY_ID:-}" ] || [ -z "${PP_ENDPOINT:-}" ] || [ -z "${PP_BUCKET:-}" ]; then
            echo "::error::ParsPack S3 secrets (PP_ACCESS_KEY / PP_SECRET_KEY / PP_ENDPOINT / PP_BUCKET) are not configured!"
            exit 1
          fi
          EP="${PP_ENDPOINT%/}"
          aws configure set default.s3.max_concurrent_requests 1
          aws configure set default.s3.multipart_threshold 64MB
          aws configure set default.s3.addressing_style path

          FAIL_CNT=0
          put_each() {
            dest="$1"; skip_meta="${2:-}"
            for f in dist/*; do
              [ -f "$f" ] || continue
              b=$(basename "$f")
              case "$b" in *arm64*) continue ;; esac
              if [ "$skip_meta" = "no-beta-meta" ] && [ "$b" = "beta-meta.json" ]; then continue; fi
              ok=0
              for i in 1 2 3; do
                if aws --endpoint-url "$EP" s3 cp "$f" "${dest}${b}" --acl public-read --no-progress 2>&1                    || aws --endpoint-url "$EP" s3 cp "$f" "${dest}${b}" --no-progress 2>&1; then
                  ok=1; break
                fi
                echo "ParsPack upload attempt $i failed for $b, retrying in $((i * 4))s..."
                sleep $((i * 4))
              done
              if [ "$ok" -ne 1 ]; then
                echo "::error::Failed to upload $b to ParsPack (${dest}${b})"
                FAIL_CNT=$((FAIL_CNT + 1))
              fi
            done
          }

          echo "Syncing Rolling Beta (amd64-only) to ${EP}/${PP_BUCKET}/MControl/beta-latest/ ..."
          put_each "s3://${PP_BUCKET}/MControl/beta-latest/"
          if [ "$MC_MODE" = "release" ]; then
            echo "Syncing Official Release (amd64-only) to ${EP}/${PP_BUCKET}/MControl/ ..."
            put_each "s3://${PP_BUCKET}/MControl/" "no-beta-meta"
          fi
          if [ "$FAIL_CNT" -gt 0 ]; then
            echo "::error::ParsPack S3 Mirror sync FAILED (${FAIL_CNT} file(s) did not upload)!"
            exit 1
          fi
          echo "ParsPack S3 Mirror sync complete & verified (amd64-only)!"
